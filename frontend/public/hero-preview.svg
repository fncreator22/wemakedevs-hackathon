<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%" height="100%" fill="none" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Glows -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>

    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7967FF"/>
      <stop offset="100%" stop-color="#5B48EE"/>
    </linearGradient>

    <linearGradient id="danger-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.2)"/>
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0.05)"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="laser-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="340" cy="200" r="180" fill="#6353e8" opacity="0.08" filter="blur(60px)"/>

  <!-- Main Viewport Glass Canvas Window -->
  <rect x="20" y="20" width="640" height="480" rx="12" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Window Header Bar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 648 20 A 12 12 0 0 1 660 32 L 660 62 L 20 62 Z" fill="#12131b"/>
  <line x1="20" y1="62" x2="660" y2="62" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="42" cy="41" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="58" cy="41" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="74" cy="41" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Header Title & Active Workspace Pill -->
  <text x="100" y="45" fill="#e4e4e7" font-size="12" font-weight="600" letter-spacing="0.02em">Reprieve Command Center</text>
  <rect x="268" y="32" width="150" height="20" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="278" cy="42" r="3" fill="#10b981"/>
  <text x="288" y="46" fill="#a1a1aa" font-size="10" font-family="monospace">ws_northwind_prod</text>

  <!-- Live Pulse Pill -->
  <rect x="526" y="32" width="118" height="20" rx="4" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)"/>
  <circle cx="538" cy="42" r="3" fill="#ef4444" filter="url(#laser-glow)"/>
  <text x="548" y="46" fill="#fca5a5" font-size="10" font-family="monospace" font-weight="600">CASCADE ACTIVE</text>

  <!-- ======================================================== -->
  <!-- LEFT PANE: CONCENTRATION RADAR & RISK BREAKDOWN          -->
  <!-- ======================================================== -->
  <rect x="40" y="82" width="280" height="268" rx="8" fill="#0e1017" stroke="rgba(255,255,255,0.06)"/>
  
  <text x="56" y="108" fill="#71717a" font-size="10" font-family="monospace" font-weight="700" letter-spacing="0.08em">HOTSPOT CONCENTRATION</text>
  <text x="56" y="132" fill="#ffffff" font-size="16" font-weight="700">payments-core</text>
  <text x="56" y="148" fill="#a1a1aa" font-size="11">Root Settlement Engine · 4 active waivers</text>

  <!-- Risk Score Badge -->
  <rect x="236" y="112" width="68" height="36" rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
  <text x="270" y="128" fill="#ef4444" font-size="13" font-family="monospace" font-weight="800" text-anchor="middle">99.1</text>
  <text x="270" y="141" fill="#fca5a5" font-size="9" font-family="monospace" text-anchor="middle">SPOF #1</text>

  <!-- Divider -->
  <line x1="56" y1="166" x2="304" y2="166" stroke="rgba(255,255,255,0.06)"/>

  <!-- Waivers List -->
  <g transform="translate(56, 178)">
    <rect x="0" y="0" width="248" height="34" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <circle cx="12" cy="17" r="3" fill="#ef4444"/>
    <text x="24" y="16" fill="#e4e4e7" font-size="11" font-weight="600">TLS 1.0 Cipher Waiver</text>
    <text x="24" y="27" fill="#71717a" font-size="9" font-family="monospace">Expired 64d ago · Priya Raman (Left)</text>
    <text x="236" y="21" fill="#f87171" font-size="10" font-family="monospace" text-anchor="end">P0</text>
  </g>

  <g transform="translate(56, 218)">
    <rect x="0" y="0" width="248" height="34" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <circle cx="12" cy="17" r="3" fill="#f59e0b"/>
    <text x="24" y="16" fill="#e4e4e7" font-size="11" font-weight="600">Fraud Retry Limit Bypass</text>
    <text x="24" y="27" fill="#71717a" font-size="9" font-family="monospace">12d overdue · Squad Checkout</text>
    <text x="236" y="21" fill="#fbbf24" font-size="10" font-family="monospace" text-anchor="end">HIGH</text>
  </g>

  <g transform="translate(56, 258)">
    <rect x="0" y="0" width="248" height="34" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <circle cx="12" cy="17" r="3" fill="#f59e0b"/>
    <text x="24" y="16" fill="#e4e4e7" font-size="11" font-weight="600">Idempotency Key Skip</text>
    <text x="24" y="27" fill="#71717a" font-size="9" font-family="monospace">Expires in 2d · Cyber Week exemption</text>
    <text x="236" y="21" fill="#fbbf24" font-size="10" font-family="monospace" text-anchor="end">HIGH</text>
  </g>

  <g transform="translate(56, 300)">
    <text x="0" y="32" fill="#7967FF" font-size="10" font-family="monospace" font-weight="600">Shortest Proof Path: 2 hops to Customer Loss →</text>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT PANE: GRAPH TOPOLOGY / PROOF PATH MINI CANVAS       -->
  <!-- ======================================================== -->
  <rect x="336" y="82" width="304" height="268" rx="8" fill="#0e1017" stroke="rgba(255,255,255,0.06)"/>
  <text x="352" y="108" fill="#71717a" font-size="10" font-family="monospace" font-weight="700" letter-spacing="0.08em">FALKORDB GRAPH TOPOLOGY</text>

  <!-- Top Node: Customer Checkout -->
  <g transform="translate(416, 126)">
    <rect x="0" y="0" width="144" height="30" rx="6" fill="#181a24" stroke="#6353e8" stroke-width="1.5"/>
    <circle cx="14" cy="15" r="4" fill="#7967FF"/>
    <text x="26" y="19" fill="#ffffff" font-size="10" font-weight="600">Customer Checkout</text>
    <text x="134" y="19" fill="#a1a1aa" font-size="8" font-family="monospace" text-anchor="end">PATH</text>
  </g>

  <!-- Edge 1 -->
  <line x1="488" y1="156" x2="488" y2="182" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="488" cy="169" r="3" fill="#ef4444" filter="url(#laser-glow)"/>

  <!-- Mid Node: checkout-api -->
  <g transform="translate(424, 182)">
    <rect x="0" y="0" width="128" height="30" rx="6" fill="#181a24" stroke="rgba(239,68,68,0.6)" stroke-width="1.2"/>
    <circle cx="14" cy="15" r="4" fill="#f87171"/>
    <text x="26" y="19" fill="#ffffff" font-size="10" font-weight="600">checkout-api</text>
    <text x="118" y="19" fill="#f87171" font-size="8" font-family="monospace" text-anchor="end">84.0</text>
  </g>

  <!-- Edge 2 (Cascade shockwave) -->
  <line x1="488" y1="212" x2="488" y2="238" stroke="#ef4444" stroke-width="2"/>
  <polygon points="488,242 484,234 492,234" fill="#ef4444"/>

  <!-- Root Culprit Node: payments-core -->
  <g transform="translate(410, 244)">
    <rect x="0" y="0" width="156" height="36" rx="6" fill="url(#danger-grad)" stroke="#ef4444" stroke-width="1.8" filter="url(#soft-glow)"/>
    <circle cx="16" cy="18" r="5" fill="#ef4444"/>
    <text x="28" y="17" fill="#ffffff" font-size="11" font-weight="700">payments-core</text>
    <text x="28" y="28" fill="#fca5a5" font-size="8" font-family="monospace">4 Colliding Exceptions</text>
    <rect x="122" y="10" width="26" height="16" rx="3" fill="#ef4444"/>
    <text x="135" y="21" fill="#ffffff" font-size="8" font-family="monospace" font-weight="800" text-anchor="middle">P0</text>
  </g>

  <!-- Dependency Edge Labels -->
  <text x="502" y="172" fill="#ef4444" font-size="8" font-family="monospace">Hop 1: DEPENDS_ON</text>
  <text x="502" y="228" fill="#ef4444" font-size="8" font-family="monospace">Hop 2: AFFECTS</text>

  <!-- Mini Legend -->
  <g transform="translate(352, 312)">
    <circle cx="4" cy="4" r="3" fill="#7967FF"/>
    <text x="14" y="7" fill="#71717a" font-size="9" font-family="monospace">Protected Path</text>
    <circle cx="110" cy="4" r="3" fill="#ef4444"/>
    <text x="120" y="7" fill="#71717a" font-size="9" font-family="monospace">Cascade Shockwave</text>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM STRIP: STEWARD AI AGENT AUTONOMOUS ACTION CARD    -->
  <!-- ======================================================== -->
  <g transform="translate(40, 366)">
    <rect x="0" y="0" width="600" height="96" rx="8" fill="#11131c" stroke="rgba(121,103,255,0.3)" stroke-width="1.2"/>
    
    <!-- Steward Badge -->
    <rect x="16" y="16" width="76" height="20" rx="4" fill="rgba(121,103,255,0.15)" stroke="#7967FF" stroke-width="0.8"/>
    <circle cx="26" cy="26" r="3" fill="#7967FF"/>
    <text x="35" y="30" fill="#c4b5fd" font-size="9" font-family="monospace" font-weight="700">STEWARD</text>
    
    <text x="100" y="30" fill="#a1a1aa" font-size="11">Autonomous Grounded Recommendation (Rule R2 + R8 Triggered)</text>

    <!-- Content -->
    <text x="16" y="54" fill="#ffffff" font-size="12" font-weight="500">
      "TLS 1.0 waiver author Priya Raman is inactive (left 64d ago). Proposed resolution:
    </text>
    <text x="16" y="70" fill="#d4d4d8" font-size="11">
      Reassign to <tspan fill="#7967FF" font-weight="600">Sam Okafor (Squad Compliance Lead)</tspan> and schedule key rotation before Cyber Week."
    </text>

    <!-- Action Buttons -->
    <rect x="424" y="44" width="80" height="28" rx="4" fill="#7967FF"/>
    <text x="464" y="62" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Approve</text>

    <rect x="512" y="44" width="72" height="28" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="548" y="62" fill="#d4d4d8" font-size="11" font-weight="500" text-anchor="middle">Review</text>
  </g>
</svg>
